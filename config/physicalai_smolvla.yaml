# SmolVLA fine-tune through Intel Physical AI Studio (Lightning).
#
# Why this exists alongside scripts/14_train_vla.sh:
#
#   14 trains with `lerobot-train` and writes a LeRobot-format checkpoint
#   (pretrained_model/model.safetensors). `physicalai export` loads through
#   Lightning's load_from_checkpoint and wants a .ckpt, so a lerobot-train
#   checkpoint cannot be handed to the OpenVINO exporter directly.
#
#   Training here produces a Lightning checkpoint, which scripts/17_export_policy.sh
#   exports to OpenVINO IR. That is the entire reason to prefer this path: it is
#   what turns "policy runs in torch on the iGPU" into "policy runs on OpenVINO".
#
# Run it with scripts/16_studio_train.sh, which pins the dataset root.

model:
  class_path: physicalai.policies.SmolVLA
  init_args:
    # Fine-tune from the pretrained base, never from scratch: the episodes teach
    # this specific pick-and-place, the base is what understands the sentence.
    #
    # NOT lerobot/smolvla_base directly -- physicalai cannot parse its LeRobot
    # config.json (see scripts/20_prepare_vla_base.py). This is the same
    # checkpoint with the non-architecture keys stripped; 16_studio_train.sh
    # builds it automatically if missing.
    pretrained_name_or_path: experiments/smolvla_base_pai
    # <= 0 keeps only the cameras present in the batch. We record one (wrist).
    num_cameras: 0
    image_key_reorder_map: {}

data:
  class_path: physicalai.data.lerobot.LeRobotDataModule
  init_args:
    repo_id: percept2act/stage2_sort
    # Pinned to an absolute path by 16_studio_train.sh so it does not matter
    # whether jsonargparse resolves relative paths against cwd or this file.
    root: datasets/stage2_sort
    train_batch_size: 16
    data_format: physicalai
    # The stock physicalai configs validate against a PushT simulator, which has
    # nothing to do with this rig -- hence no val_gym. And at 30 episodes total,
    # holding frames out costs more than the eval signal is worth.
    val_split: 0.0

trainer:
  max_steps: 4000
  accelerator: xpu           # Arc B390 iGPU
  strategy: xpu_single
  devices: 1
  precision: 32
  log_every_n_steps: 100

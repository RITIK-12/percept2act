# Scenario configuration — single source of truth.
#
# Everything scenario-specific lives HERE. If you find yourself editing Python
# to accommodate something the organizers revealed, stop and add a key instead.
#
# Values verified on the box 2026-09-15 are marked [VERIFIED].
# Values still needing a physical measurement are marked TODO@RIG.

task:
  # The three instruction strings. These are the Anomalib -> SmolVLA seam:
  # the detector's verdict selects which string conditions the policy.
  instructions:
    defective: "put the brick in the coral plate"
    good:      "put the brick in the blue plate"

  # Revealed at kickoff.
  defect_definition: >
    Physical damage to the brick: chipped, cracked, missing or deformed studs.

classes:
  good:
    plate: blue
    instruction: good
  defective:
    plate: coral
    instruction: defective
  unsure:
    # Scores inside the uncertainty band are never silently guessed.
    behavior: reinspect      # reinspect | set_aside | hold
    max_reinspect: 1
    # After max_reinspect attempts still unsure -> fall back to this class.
    fallback_class: defective

# ---------------------------------------------------------------------------
# Hardware. [VERIFIED] from lerobot-find-port + shell history 2026-09-14.
# by-id paths are used because /dev/ttyACM* indices reshuffle on replug.
# ---------------------------------------------------------------------------
arms:
  follower:                     # LEFT arm. Gripper + wrist cam. Does all manipulation.
    type: so101_follower
    id: hack_follower           # [VERIFIED] existing calibration in ~/.cache/huggingface/lerobot
    port: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B79018567-if00   # [VERIFIED] -> ttyACM1
  leader:                       # RIGHT arm. Handle only. Teleop input for recording.
    type: so101_leader
    id: hack_leader             # [VERIFIED] existing calibration
    port: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B8E113248-if00   # [VERIFIED] -> ttyACM0

cameras:
  # [VERIFIED] 2x RealSense D415 + 1x Sonix UVC webcam present.
  # Which RealSense serial is overhead vs inspect is assigned by
  # scripts/02_assign_cameras.py -- run it before recording.
  wrist:
    kind: opencv                # Sonix USB2.0_CAM1, mounted on the follower
    index_or_path: /dev/v4l/by-id/usb-Sonix_Technology_Co.__Ltd._USB2.0_CAM1_USB2.0_CAM1-video-index0
    width: 640
    height: 480
    fps: 30
    exposure: 150            # [TUNED]
    brightness: 32            # [TUNED]
  overhead:
    kind: realsense
    serial: "243622062278"           # [ASSIGNED]
    width: 640
    height: 480
    fps: 30
    use_depth: false            # depth available if we want it; off by default
  front:
    kind: realsense
    serial: "243722062690"           # [ASSIGNED]
    width: 640
    height: 480
    fps: 30
    use_depth: false

  # The gripper camera serves BOTH consumers, which is why it is the only one
  # enabled:
  #   * policy  -- it sees the gripper-to-brick relationship, which is where
  #     pick-and-place policies actually fail. The standard LeRobot SO-101
  #     setup is a wrist camera for exactly this reason.
  #   * detector -- the defect is marker marks on the TOP faces of the studs.
  #     Only a top-down close-up resolves them. The `front` tripod camera
  #     views bricks side-on from across the table at a few dozen pixels, so
  #     the defect signal is simply not in its image.
  #
  # It moves with the arm, so the detector frame must be grabbed at a
  # consistent home pose hovering over the pickup spot. Fixed pose and scale
  # is also what makes a memory-bank model like PatchCore accurate.
  policy_inputs: [wrist]
  detector_input: wrist

# The fixed spot on the mat where ACT presents each brick for inspection.
# Fixing pose + scale + lighting here is what makes a memory-bank anomaly
# model viable on ~50 normals.
inspection_station:
  # Fixed pose the arm returns to before every inspection, so the wrist
  # camera sees the brick from the same angle and distance each time --
  # which is what makes a memory-bank model like PatchCore comparable at
  # all. Median first-frame pose across all 30 recorded episodes, so the
  # ramp to it is short from wherever the arm ends up.
  pose: [-1.54, -37.76, 9.10, 99.82, -80.48, 21.01]   # [TELEOP-SET]
  # Region of the WRIST camera frame that Anomalib scores, measured from
  # frame 0 of a recorded episode (i.e. the arm at its start pose). Bricks
  # fill it and the marker marks are resolvable inside it.
  crop: [72, 52, 328, 308]      # 256x256 -- matches detector.input_size, so NO resampling

# ---------------------------------------------------------------------------
# Detector — Anomalib. Normal-only training; no defective examples needed.
# ---------------------------------------------------------------------------
detector:
  model: patchcore              # patchcore suits localized structural damage
  backbone: wide_resnet50_2     # [VERIFIED] already cached (264 MB)
  layers: [layer2, layer3]
  coreset_sampling_ratio: 1.0     # keep every patch: 28 normals is far too few to subsample
  num_neighbors: 9
  input_size: [256, 256]

  # Measured on the v2 set: 5 bricks x 10 crops, 2 per brick held out of the fit.
  #   good (fitted, n=40)  0.0000 - 0.4883  mean 0.0627
  #   held out (n=10)      0.0000 - 0.3960  mean 0.2228
  #   defective (n=50)     0.4324 - 1.0000  mean 0.8036
  # Threshold sits between held-out max and defective min, so every held-out
  # crop and every defect classifies correctly. Three fitted normals sit above
  # it -- see docs/DEMO.md. The band is kept narrow deliberately: widening it
  # far enough to catch those three would swallow the lowest defects too.
  threshold: 0.4142
  uncertainty_band: 0.012       # scores within +/- this of threshold => unsure

  # v2: 5 distinct bricks, 10 crops each, one brick per subfolder. The v1 set
  # was ~47 crops of a SINGLE brick, so the memory bank encoded that brick
  # rather than "undamaged" and a different good brick scored as defective.
  # One good brick (liteGreen) is held out of the fit entirely -- scoring it is
  # the only honest test that a brick the model has never seen still passes.
  normals_dir: datasets/v2/good
  defects_dir: datasets/v2/defective   # threshold validation only, never fitted
  holdout_dir: datasets/v2_holdout     # never fitted; see 11_benchmark --holdout
  export_dir: experiments/detector

# ---------------------------------------------------------------------------
# Policies — trained in Physical AI Studio, exported to OpenVINO IR.
# ---------------------------------------------------------------------------
policies:
  stage2_sort:
    policy: smolvla
    base_checkpoint: lerobot/smolvla_base
    dataset_repo_id: percept2act/stage2_sort
    episodes_per_instruction: 30
    export_dir: experiments/smolvla_sort

  # Per-step action-chunk execution budget.
  max_steps_per_stage: 400
  control_fps: 30

# ---------------------------------------------------------------------------
# OpenVINO device placement. Measured in scripts/11_benchmark.py; the demo
# requires explaining each choice out loud.
# ---------------------------------------------------------------------------
openvino:
  devices:
    detector: NPU               # fixed shape, sustained -> NPU, frees CPU
    stage2_sort: GPU            # SmolVLA ~500M VLM, needs Arc iGPU throughput
    control: CPU                # IK, gripper checks, camera decode: latency-sensitive
  precision: FP16               # try INT8 via nncf once FP16 works
  log_latency: true

# ---------------------------------------------------------------------------
# Replay executor -- closes the loop with recorded demos instead of a trained
# policy. Blind playback, so every brick must start at the same marked spot.
# Swap to the `policy` executor once SmolVLA has trained; nothing else changes.
# ---------------------------------------------------------------------------
replay:
  dataset_root: datasets/stage2_sort
  # Teleop start poses drift ~20 degrees episode to episode, so blind
  # playback from wherever the arm happens to be would not line up with the
  # recorded trajectory. Ramp into the episode's own first pose first.
  ramp_seconds: 2.0
  # Which recorded episode to play back per verdict. Episode indices are
  # 0-based in the order they were recorded. Check with:
  #   bash scripts/07_verify_dataset.sh
  episodes:
    defective: 16    # coral. single-brick take, 366 frames
    good: 26         # blue.  single-brick take, 368 frames

# ---------------------------------------------------------------------------
# Live watcher (scripts/12_demo.py) -- autonomous sorting with no teleop.
# ---------------------------------------------------------------------------
watch:
  # Fraction of the crop that must look like a saturated brick for the spot to
  # count as occupied. Measured on the captured sets: empty crops sit below
  # 2%, crops containing a brick run 3.7-13%.
  brick_fraction: 0.025

runtime:
  # Single process, in the `hack_lerobot` conda env -- it is the one env that has
  # lerobot, anomalib and openvino together, so the whole loop runs in one
  # command with no IPC. The Studio backend venv is used only for training and
  # export, where `physicalai` lives.
  latency_log: experiments/latency.jsonl
  max_bricks_per_run: 20
